const FB={"apiKey":"AIzaSyAk5k9wKPBG0HO7Nq4MzweuxoBqufJlwm4","databaseURL":"https://juntoscar-default-rtdb.europe-west1.firebasedatabase.app","projectId":"juntoscar"};
const HAS_FB=true;
let carrito={};

function fe(v){return v.toFixed(2).replace('.',',')+' €';}
function addItem(id){carrito[id]=(carrito[id]||0)+1;uiCtrl(id);uiBar();}
function remItem(id){if(!carrito[id])return;carrito[id]--;if(!carrito[id])delete carrito[id];uiCtrl(id);uiBar();}

function uiCtrl(id){
  const el=document.getElementById('ctrl_'+id);if(!el)return;
  const q=carrito[id]||0;
  if(q===0){el.innerHTML='<button class="btn-add" onclick="addItem(''+id+'')">+</button>';}
  else{el.innerHTML='<div class="qty-ctrl"><button class="btn-q" onclick="remItem(''+id+'')">−</button><span class="qty-n">'+q+'</span><button class="btn-q btn-q-plus" onclick="addItem(''+id+'')">+</button></div>';}
}

function totales(){
  let t=0,c=0;
  Object.entries(carrito).forEach(([id,q])=>{const p=PRODS.find(x=>x.id===id);if(p){t+=p.precio*q;c+=q;}});
  return{t,c};
}

function uiBar(){
  const{t,c}=totales();
  document.getElementById('cart-count').textContent=c;
  document.getElementById('cart-tot-bar').textContent=fe(t);
  document.getElementById('cart-bar').style.display=c>0?'flex':'none';
  if(document.getElementById('sheet-total'))document.getElementById('sheet-total').textContent=fe(t);
}

function abrirSheet(){
  renderSheet();
  document.getElementById('overlay').style.display='block';
  document.getElementById('sheet').classList.add('open');
}
function cerrarSheet(){
  document.getElementById('overlay').style.display='none';
  document.getElementById('sheet').classList.remove('open');
}

function renderSheet(){
  const items=Object.entries(carrito);
  if(!items.length){document.getElementById('sheet-items').innerHTML='<div style="text-align:center;padding:32px;color:#aaa">No has añadido nada</div>';return;}
  document.getElementById('sheet-items').innerHTML=items.map(([id,q])=>{
    const p=PRODS.find(x=>x.id===id);if(!p)return'';
    const ico=p.imagen?'<img src="'+p.imagen+'" style="width:44px;height:44px;object-fit:cover;border-radius:8px">':'<div style="width:44px;height:44px;border-radius:8px;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:22px">'+p.emoji+'</div>';
    return'<div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #f5f5f5">'+ico+'<div style="flex:1"><div style="font-weight:600;font-size:14px">'+p.nombre+'</div><div style="color:#e67e22;font-size:13px;margin-top:2px">'+fe(p.precio*q)+'</div></div><div class="qty-ctrl"><button class="btn-q" onclick="remItem(''+id+'');renderSheet()">−</button><span class="qty-n">'+q+'</span><button class="btn-q btn-q-plus" onclick="addItem(''+id+'');renderSheet()">+</button></div></div>';
  }).join('');
  uiBar();
}

function enviarPedido(){
  if(!HAS_FB){alert('El sistema de pedidos online no está disponible.');return;}
  const{t,c}=totales();
  if(c===0){alert('Añade algún producto primero.');return;}
  const mesa=(document.getElementById('mesa-in').value||'').trim()||'Sin mesa';
  const items=Object.entries(carrito).map(([id,q])=>{
    const p=PRODS.find(x=>x.id===id);
    return{productoId:id,nombre:p.nombre,precio:p.precio,cantidad:q,emoji:p.emoji,imagen:p.imagen};
  });
  const btn=document.getElementById('btn-enviar');
  btn.disabled=true;btn.textContent='⏳ Enviando...';
  try{
    const db=firebase.database();
    db.ref('pedidos').push({mesa,items,total:t,estado:'pendiente',timestamp:Date.now()})
      .then(()=>{
        carrito={};PRODS.forEach(p=>uiCtrl(p.id));uiBar();cerrarSheet();
        document.getElementById('confirm').style.display='flex';
        btn.disabled=false;btn.textContent='📲 Enviar pedido al bar';
      })
      .catch(e=>{btn.disabled=false;btn.textContent='📲 Enviar pedido al bar';alert('Error: '+e.message);});
  }catch(e){btn.disabled=false;btn.textContent='📲 Enviar pedido al bar';alert('Firebase no disponible: '+e.message);}
}

function cerrarConfirm(){document.getElementById('confirm').style.display='none';}

if(HAS_FB&&typeof firebase!=='undefined'){
  try{firebase.initializeApp(FB);}catch(e){if(e.code!=='app/duplicate-app')console.error(e);}
}
</script>
